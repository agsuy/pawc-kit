name: Sync dev after release

# Merges main back into dev after the Release workflow completes.
# Keeps dev up to date with PSR's version bumps, changelog, and uv.lock
# so the next dev -> main PR has no PSR-owned file conflicts.
#
# Triggered via workflow_run (not push) so [skip ci] on the PSR release
# commit does not suppress this workflow.
#
# .gitattributes marks PSR-owned files with merge=ours so they
# auto-resolve in favour of dev when the merge runs.

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

jobs:
  sync-dev:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: dev

      - name: Configure git
        run: |
          git config user.name "agsuy"
          git config user.email "37564412+agsuy@users.noreply.github.com"
          git config merge.ours.driver true

      - name: Merge main into dev
        run: |
          git merge origin/main --no-edit

      - name: Push
        run: git push origin dev
