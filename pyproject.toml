[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pawc-kit"
version = "0.3.0"
description = "PAWC Core: shared SDK for workflow models, state, layout, and orchestration"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["workflow", "orchestration", "llm", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "semver>=3.0,<4",
    "toon-formatter>=1.0",
]
authors = [
    { name = "agsuy", email = "37564412+agsuy@users.noreply.github.com" },
]

[project.urls]
Repository = "https://github.com/agsuy/pawc-kit"
Issues = "https://github.com/agsuy/pawc-kit/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
]
semantic = [
    "semantic-text-splitter>=0.18",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-m 'not llm_paid'"
markers = [
    "unit: fast isolated tests",
    "integration: tests using real FS adapters",
    "slow: tests that may take longer",
    "llm_local: tests using a local LLM backend (Ollama, llama.cpp, vLLM, etc.)",
    "llm_paid: tests that call a paid LLM API requiring an API key (excluded by default)",
]

[tool.coverage.run]
source = ["pawc_kit"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[dependency-groups]
dev = [
    "pawc-kit[otel,semantic]",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-cov>=6.0",
    "python-semantic-release>=10.5",
    "ruff>=0.15.6",
]

[tool.semantic_release]
commit_author = "agsuy <37564412+agsuy@users.noreply.github.com>"
commit_message = "chore(release): {version}\n\n[skip ci]"
commit_parser = "conventional"
tag_format = "v{version}"
allow_zero_version = true
major_on_zero = false
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/pawc_kit/__init__.py:__version__"]
build_command = """
uv lock --upgrade-package "$PACKAGE_NAME"
git add uv.lock
uv build
"""

[tool.semantic_release.branches.main]
match = "(main)"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
mask_initial_release = true

[tool.semantic_release.remote]
type = "github"

[tool.semantic_release.remote.token]
env = "GH_TOKEN"

[tool.semantic_release.publish]
upload_to_vcs_release = true

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
